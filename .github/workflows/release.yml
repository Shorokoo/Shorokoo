# Shorokoo release pipeline.
#
# Manually launched (workflow_dispatch) with a version, e.g. 0.1.0-preview.1.
# A run tags the commit v<version> (MinVer derives the package version from the
# tag), builds + tests, packs the shipping projects, publishes them to nuget.org
# via Trusted Publishing (OIDC), pushes the tag, and creates a GitHub Release.
# There is NO push trigger: nothing publishes unless you launch this workflow.
#
# The nuget.org Trusted Publishing policy is bound to this file by name
# (release.yml) -> keep the filename stable.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to release, e.g. 0.1.0-preview.1 (no leading v)"
        required: true
        type: string

permissions:
  id-token: write       # OIDC token for NuGet Trusted Publishing
  contents: write       # push the tag + create the GitHub Release
  packages: write       # mirror the packages to GitHub Packages

jobs:
  # Shorokoo.OnnxRuntime carries a native library of its own, the allocator and operators it hands
  # ONNX Runtime (src/Backend/OnnxRuntime/Shorokoo.OnnxRuntime/native), for every platform the
  # backends target. A build makes only its own platform's, so the Windows one is built here and
  # handed to the publish job, which builds the Linux one as part of its own build and packs both.
  native-allocator-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The library is compiled against ONNX Runtime's C API header, which the project's restore
      # brings in the Microsoft.ML.OnnxRuntime package.
      - name: Build the native allocator (win-x64)
        run: |
          $project = "src/Backend/OnnxRuntime/Shorokoo.OnnxRuntime/Shorokoo.OnnxRuntime.csproj"
          dotnet restore $project
          $env:DOTNET_NOLOGO = "1"
          $include = (dotnet msbuild $project -getProperty:PkgMicrosoft_ML_OnnxRuntime | Select-Object -Last 1).Trim() + "/build/native/include"
          cmake -S src/Backend/OnnxRuntime/Shorokoo.OnnxRuntime/native -B build/allocator -DSHOROKOO_OUTPUT_DIR="${{ github.workspace }}/artifacts/native/win-x64" -DSHOROKOO_ORT_INCLUDE_DIR="$include"
          cmake --build build/allocator --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: native-allocator-win-x64
          path: artifacts/native/win-x64/shorokoo_ort_allocator.dll
          if-no-files-found: error

  publish:
    needs: native-allocator-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # MinVer needs full history + tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tag locally so MinVer stamps <version> into the packages. The tag is
      # pushed only after a successful publish (below), so a failed run leaves no
      # tag behind.
      - name: Create tag (local)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"

      # The coverage suite runs models on the PyTorch CPU backend too, whose Python environment is
      # provisioned with uv, from the backend's lock file, the first time a test needs it.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Build & test
        run: >
          dotnet test tests/Shorokoo.Tests/Shorokoo.Tests.csproj
          --filter "Purpose=Coverage"
          -c Release --logger "console;verbosity=minimal"

      # The runner's C and C++ runtimes are newer than the oldest Linux ONNX Runtime runs on, and a
      # library built here could ask for a symbol version only they have. Nothing the native
      # allocator needs may be newer than what ONNX Runtime's own library needs.
      - name: Check the native allocator asks no more of Linux than ONNX Runtime does
        run: |
          lib=src/Backend/OnnxRuntime/Shorokoo.OnnxRuntime/obj/native/linux-x64/libshorokoo_ort_allocator.so
          ort=$(ls ~/.nuget/packages/microsoft.ml.onnxruntime/*/runtimes/linux-x64/native/libonnxruntime.so | head -1)
          newest() { objdump -T "$1" | grep -oE "\($2_[0-9.]+\)" | tr -d '()' | sort -V | tail -1; }
          for family in GLIBC GLIBCXX CXXABI GCC; do
            mine=$(newest "$lib" "$family"); theirs=$(newest "$ort" "$family")
            [ -z "$mine" ] && continue
            if [ -z "$theirs" ] || [ "$(printf '%s\n%s\n' "$mine" "$theirs" | sort -V | tail -1)" != "$theirs" ]; then
              echo "::error::$lib needs $mine, and ONNX Runtime needs no newer than ${theirs:-none of $family}"
              exit 1
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: native-allocator-win-x64
          path: artifacts/native/win-x64

      # Each Purpose=Benchmark check measures the machine — wall clock, process-wide
      # memory growth, or both — so each gets a process of its own. Anything sharing
      # the process pollutes the measurement: the memory check's baseline is
      # meaningless if another test has been training in the same heap, and the
      # scaling check reads PeakWorkingSet64, which any earlier allocation in the
      # process raises. One invocation per class is the only isolation that is
      # actually verifiable: `-- xUnit.MaxParallelThreads=1` on this command line is
      # accepted and silently ignored, and a .runsettings <xUnit> node did not take
      # effect either. Adding a Purpose=Benchmark class means adding a step here —
      # no filter in this file selects one implicitly. All of them must come before
      # the Purpose=Gate step: that one shells out to a full parallel `dotnet build`,
      # whose MSBuild workers wreck any measurement sharing its process.
      - name: Benchmark — training hot path (own process)
        run: >
          dotnet test tests/Shorokoo.Tests/Shorokoo.Tests.csproj
          --filter "FullyQualifiedName~TrainingPerfBaselineTests"
          -c Release --logger "console;verbosity=minimal" --no-build

      - name: Benchmark — memory stability (own process)
        run: >
          dotnet test tests/Shorokoo.Tests/Shorokoo.Tests.csproj
          --filter "FullyQualifiedName~TrainingMemoryStabilityTests"
          -c Release --logger "console;verbosity=minimal" --no-build

      - name: Benchmark — rig-construction scaling (own process)
        run: >
          dotnet test tests/Shorokoo.Tests/Shorokoo.Tests.csproj
          --filter "FullyQualifiedName~RigConstructionScalingTests"
          -c Release --logger "console;verbosity=minimal" --no-build

      - name: Benchmark — memory-aware pass (own process)
        run: >
          dotnet test tests/Shorokoo.Tests/Shorokoo.Tests.csproj
          --filter "FullyQualifiedName~MemoryPassBenchmarkTests"
          -c Release --logger "console;verbosity=minimal" --no-build

      - name: Build-hygiene gate
        run: >
          dotnet test tests/Shorokoo.Tests/Shorokoo.Tests.csproj
          --filter "Purpose=Gate"
          -c Release --logger "console;verbosity=minimal" --no-build

      - name: Pack
        run: >
          dotnet pack Shorokoo.sln -c Release -o artifacts/nupkgs
          -p:ShorokooNativeAllocators=${{ github.workspace }}/artifacts/native

      # OIDC -> short-lived nuget.org API key (~1h). No stored API key.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push each package individually: a glob push aborts the whole queue on
      # the first rejected file, which half-publishes the release (immutable
      # versions make that expensive — it burned 0.1.2/0.1.3). Attempt every
      # package, then fail the job if any push failed. --skip-duplicate keeps
      # re-runs of the same version safe.
      - name: Push to nuget.org
        run: |
          failed=0
          for pkg in artifacts/nupkgs/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate || { echo "::error::Push failed for $pkg"; failed=1; }
          done
          exit "$failed"

      # Don't mirror/tag/release until nuget.org lists every package at the new
      # version (validation/indexing usually takes a few minutes). A partial
      # publish fails here, loudly, naming what's missing.
      - name: Verify all packages are live on nuget.org
        run: |
          version="${{ inputs.version }}"
          for pkg in artifacts/nupkgs/*."$version".nupkg; do
            id=$(basename "$pkg" ".$version.nupkg")
            idLower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            url="https://api.nuget.org/v3-flatcontainer/$idLower/index.json"
            ok=""
            for attempt in $(seq 1 30); do
              if curl -fsSL "$url" | grep -qF "\"$version\""; then ok=1; break; fi
              echo "$id $version not indexed yet (attempt $attempt/30); retrying in 30s"
              sleep 30
            done
            [ -n "$ok" ] || { echo "::error::$id $version never appeared on nuget.org"; exit 1; }
            echo "$id $version is live"
          done

      # The packages are verified live on the canonical feed: tag now, so no
      # later (best-effort) step can leave a published version untagged again.
      - name: Push tag
        run: git push origin "v${{ inputs.version }}"

      # Mirror to GitHub Packages so the packages also show in the repo's sidebar.
      # Uses the built-in GITHUB_TOKEN (no secret needed). --no-symbols because
      # GitHub Packages doesn't accept .snupkg the way nuget.org does. nuget.org
      # remains the canonical source; this is a convenience mirror — best-effort
      # (continue-on-error), it must never block the tag/Release.
      - name: Push to GitHub Packages
        continue-on-error: true
        run: >
          dotnet nuget push "artifacts/nupkgs/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
          --no-symbols

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ inputs.version }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v${{ inputs.version }}" $prerelease \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            artifacts/nupkgs/*.nupkg
